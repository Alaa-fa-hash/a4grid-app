name: Android Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER_DIR="$(dirname "$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)")"
          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Patch legacy SQLite repository
        run: sed -i 's/jcenter()/mavenCentral()/g' node_modules/react-native-sqlite-storage/platforms/android/build.gradle

      - name: Download vendored React Native dependency
        run: |
          mkdir -p android/local-maven/com/facebook/react/react-android/0.88.1
          curl -L --fail --retry 10 --retry-all-errors -o android/local-maven/com/facebook/react/react-android/0.88.1/react-android-0.88.1-release.aar \
            https://github.com/Alaa-fa-hash/a4grid-app/releases/download/deps-0.88.1/react-android-0.88.1-release.aar
          curl -L --fail --retry 10 --retry-all-errors -o android/local-maven/com/facebook/react/react-android/0.88.1/react-android-0.88.1.pom \
            https://github.com/Alaa-fa-hash/a4grid-app/releases/download/deps-0.88.1/react-android-0.88.1.pom

      - name: Verify vendored React Native artifacts
        run: |
          test -f android/local-maven/com/facebook/react/react-android/0.88.1/react-android-0.88.1-release.aar || { echo "react-android AAR missing"; exit 1; }
          ls -lh android/local-maven/com/facebook/react/react-android/0.88.1/

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: a4grid-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
